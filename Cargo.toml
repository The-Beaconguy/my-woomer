[package]
name = "woomer"
version = "0.3.0"
edition = "2021"

[dependencies]
# The `freeze-feat-andreas` branch woomer used no longer exists upstream, so use the released crate.
libwayshot = "0.10"
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-egl = "0.32"
khronos-egl = { version = "6", features = ["dynamic"] }
glow = "0.14"

[features]
dev = []
